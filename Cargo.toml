[package]
name = "rpsx-emu"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = { version = "*" }
wgpu = "*"
wgpu-profiler = "*"
anyhow = "*"
vek = "*"
bytemuck = {version = "*", features = [ "derive" ] }
bitfield = "*"
cgmath = "0.18"
pollster = "*"
web-time = "*"
env_logger = "*"
log = "*"
gilrs = "*"
cpal = { version = "*", features = ["pipewire"]}
crossbeam = "*"
num_enum = "*"
arrayvec = { version = "*", features = ["serde"]}
core_affinity = "0.8"
cranelift = "*"
cranelift-module = "*"
cranelift-jit = "*"
cranelift-native = "*"
target-lexicon = "*"
serde = { version = "*", features = ["derive"] }
serde_bytes = "*"
serde_arrays = "*"
flexbuffers = "*"
lru = "*"
libc = "*"
userfaultfd = "*"
nix = {version = "*", features = ["ioctl", "mman", "feature", "poll"]}
memmap2 = "*"
iced-x86 = "*"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg"]

[profile.release]
debug = 1

